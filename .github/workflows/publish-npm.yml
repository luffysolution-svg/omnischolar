name: Release Python, npm, and plugin packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Publish npm package if the version is missing
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          package="@luffysolution/omnischolar-pi"
          if view_output="$(npm view "${package}@${version}" version --prefer-online 2>&1)"; then
            echo "${package}@${version} is already published"
          else
            view_status=$?
            if grep -Eiq 'E404|404 Not Found|No match found' <<<"${view_output}"; then
              publish_output="$(npm publish --access public --provenance 2>&1)" || publish_status=$?
              if [[ "${publish_status:-0}" -eq 0 ]]; then
                printf '%s\n' "${publish_output}"
              elif grep -Eiq 'E409|cannot publish over|previously published version' <<<"${publish_output}"; then
                echo "${package}@${version} was published concurrently; treating it as complete"
              else
                printf '%s\n' "${publish_output}"
                exit "${publish_status}"
              fi
            else
              printf '%s\n' "${view_output}"
              echo "Unable to determine whether ${package}@${version} exists; refusing to publish blindly" >&2
              exit "${view_status}"
            fi
          fi

  github-release:
    needs: [python, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
